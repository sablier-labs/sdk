# Creates GitHub releases automatically when version tags (e.g. v1.0.0) are pushed.
# Also, syncs the major version branch (e.g. v1) with the release tag.
# Also, stages the version on npm. Prerelease tags (e.g. v1.0.0-beta.1) only stage.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Create Github release
        uses: docker://antonyurchenko/git-release:v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync major version branch with release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: | #shell
          # Extract major version from tag (e.g., v1.2.3 -> v1)
          MAJOR_VERSION=$(echo "$TAG_NAME" | cut -d. -f1)
          MAJOR_BRANCH="$MAJOR_VERSION"

          echo "Syncing branch '$MAJOR_BRANCH' with tag '$TAG_NAME'"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$MAJOR_BRANCH" || true
          git checkout -B "$MAJOR_BRANCH"
          git push origin "$MAJOR_BRANCH" --force

  # Stages the version on npm through trusted publishing (OIDC). It stays unpublished until a maintainer approves it.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      # `npm stage` needs npm >= 11.15.0
      - name: Install npm
        run: npm install --global npm@11.20.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: true

      - name: Set up Just
        uses: extractions/setup-just@v4

      # The devkit justfiles require the na, ni, and nlx binaries
      - name: Install Ni
        run: npm install --global @antfu/ni@30.6.0

      - name: Verify the tag and derive the dist-tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: | #shell
          VERSION=$(jq -r '.version' package.json)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

          # A prerelease uses its identifier as the dist-tag, e.g. 4.2.0-beta.1 -> beta. Stable versions omit --tag,
          # so npm refuses to move `latest` back to an older version.
          DIST_TAG=""
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
            if ! [[ "$DIST_TAG" =~ ^[a-z][a-z-]*$ ]] || [ "$DIST_TAG" = "latest" ]; then
              echo "::error::Unsupported prerelease identifier in version $VERSION"
              exit 1
            fi
          fi
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      # The prepack script installs the dependencies and builds the package
      - name: Stage the package on npm
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm stage publish ${DIST_TAG:+--tag "$DIST_TAG"}
